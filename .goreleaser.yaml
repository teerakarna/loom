version: 2

# No container image, no Helm chart - loom is one static Go binary plus a stdio MCP server
# (docs/design.md's OSS-readiness plan is explicit that candor's Kubernetes-shaped release
# machinery would be cargo cult here). This file only handles the binary archives, checksums,
# SBOM, signing, changelog, and the GitHub Release itself.
builds:
  - id: loom
    main: ./cmd/loom
    binary: loom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: loom
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# One SBOM per archive (goreleaser's own syft integration - no extra infra), so "what's in this
# binary" is answerable from the release itself, not just from go.sum at the tag.
sboms:
  - id: archive
    artifacts: archive

# Keyless-signs checksums.txt (Fulcio/Rekor via OIDC, no stored key - same pattern as candor's own
# binary releases). Every archive's hash is in there, so signing the one file covers all of them.
# Sigstore's current bundle format (verification material + signature + cert in one file), not the
# deprecated --output-signature/--output-certificate flags.
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  prerelease: auto
  footer: |
    ## Verifying this release

    `checksums.txt` is keyless-signed with cosign - covers every archive in this release, since
    they are all hashed in that one file. Verify with:

    ```
    cosign verify-blob --bundle checksums.txt.bundle \
      --certificate-identity-regexp "^https://github.com/teerakarna/loom/" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    ```

    Each archive also carries its own SPDX SBOM (`<archive>.sbom.json`, syft's default format -
    confirmed against a real local build, not assumed).

    No `go install .../loom/cmd/loom@latest` command while this repo stays private - see README
    for the private-install path. This section updates once that changes.
