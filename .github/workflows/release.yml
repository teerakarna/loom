name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Called by release-please.yml with the tag it just created. A tag pushed by hand still
  # triggers the push path above, with no input.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and release
        required: true
        type: string
  # Recovery: release-please publishes the release before this builds, so a failed build leaves a
  # release with no binaries and nothing re-runs it. Run this with the existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach binaries to
        required: true
        type: string

# Least-privilege default so a job added later without its own block doesn't inherit the repo's
# default token scope.
permissions: {}

jobs:
  binaries:
    name: Build binaries + GitHub Release
    runs-on: ubuntu-latest
    # Generous relative to a normal run (goreleaser's own snapshot build here took well under a
    # minute), but this is a tag push, not a PR - rare enough that a wide bound costs nothing, and
    # the point is only to stop a stalled OIDC call to Fulcio/Rekor or a network stall from running
    # to GitHub's own 360-minute default with nothing watching, the same reason ci.yml's jobs are
    # bounded (found by code review: this job had none).
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # keyless cosign signing of checksums.txt (Fulcio/Rekor via OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }} # the tag, not the caller's branch, when called
          fetch-depth: 0 # goreleaser's changelog needs full history
          persist-credentials: false # nothing after this step needs git push access

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6" # pinned explicitly, not left to the action's own default

      # goreleaser shells out to syft for each archive's SBOM and does not install it. The first
      # real tag (v0.5.0) failed with `exec: "syft": executable file not found in $PATH`; the local
      # snapshot run that had "verified" this pipeline had syft installed already.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: "v1.54.0" # pinned exactly, same reason as goreleaser below

      - name: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.18.2" # the action's own default ("~> v2") floats within v2.x - pinned exactly instead
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
